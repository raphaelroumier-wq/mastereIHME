
services:
  db:
    image: postgres:17
    container_name: reservation-velos-db
    environment:
      POSTGRES_DB: reservation_velos
      POSTGRES_USER: app
      POSTGRES_PASSWORD: dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
